[package]
name = "cargo-chill"
version = "2025.6.3"
edition = "2024"
license = "Beerware"
homepage = "https://crates.io/crates/cargo-chill"
repository = "https://github.com/booniepepper/cargo-chill"
description = "Chill out with some byte-counting robots."
keywords = ["terminal", "tui", "game", "incremental", "ascii-art"]

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = "0.29.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha256 = "1.6.0"
sysinfo = "0.35.2"
